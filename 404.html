<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Called To Build</title>
    <link rel="icon" href="./public/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/not-found.css" />
  </head>
  <body>
    <main class="not-found-page">
      <header class="site-header" aria-label="Challenge audience">
        <p class="eyebrow">
          <span class="eyebrow__dot" aria-hidden="true"></span>
          Christian Decluttering Business Owners
        </p>
      </header>

      <section class="not-found" aria-labelledby="not-found-title">
        <div class="error-art" aria-hidden="true">
          <span>4</span>
          <span class="error-art__zero">
            <span>?</span>
          </span>
          <span>4</span>
        </div>

        <p class="banner">That page doesn't exist</p>
        <h1 id="not-found-title">Let's get you back on track.</h1>
        <p class="not-found__copy">
          You didn't break the internet, but we couldn't find what you're looking for.
          Head home or apply for the 90-Day Decluttering Scaling Challenge.
        </p>

        <div class="not-found__actions">
          <a class="button button--primary" href="/">Back To Home</a>
          <a class="button button--secondary" href="/signup">Apply For The Challenge</a>
        </div>
      </section>
    </main>
  </body>
</html>
