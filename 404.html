<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173f43">
    <meta name="robots" content="noindex">
    <title>Page Not Found | Organized &amp; Beautiful</title>
    <link rel="icon" href="/oab-anniversary/web/assets/logo.webp">
    <link rel="stylesheet" href="/oab-anniversary/web/referral/referral.css">
    <link rel="stylesheet" href="/src/not-found.css">
  </head>
  <body>
    <div class="birthday-bar">OAB’S 3RD BIRTHDAY</div>
    <header class="page-header shell">
      <a href="/" aria-label="Organized and Beautiful referral homepage">
        <img src="/oab-anniversary/web/assets/logo.webp" alt="Organized and Beautiful Co." width="640" height="212">
      </a>
      <span>Home organizing<br><strong>Dallas–Fort Worth</strong></span>
    </header>
    <main class="hero shell not-found">
      <div>
        <p class="eyebrow">Page not found</p>
        <h1>We couldn’t find<br><span>that page.</span></h1>
        <p class="intro">If a friend sent you here, you can still use their referral code on the offer page.</p>
        <div class="not-found__actions">
          <a class="button" id="referral-offer" href="/">See the $150 referral offer <span aria-hidden="true">↗</span></a>
          <a class="not-found__secondary" href="/pastcustomers">I’m a past client <span aria-hidden="true">→</span></a>
        </div>
      </div>
      <figure class="not-found__photo">
        <img src="/oab-anniversary/web/assets/project-2.jpg" alt="An OAB client’s closet after organizing, with a clear bench and labeled bins" width="800" height="1067">
      </figure>
    </main>
    <footer class="page-footer shell not-found__footer">
      <p>Organized &amp; Beautiful Co., LLC</p>
    </footer>
    <script type="module">
      const code = new URLSearchParams(window.location.search).get("code")?.trim();
      if (code) {
        const offer = new URL("/", window.location.origin);
        offer.searchParams.set("code", code.slice(0, 80));
        document.querySelector("#referral-offer").href = offer.href;
      }
    </script>
  </body>
</html>
