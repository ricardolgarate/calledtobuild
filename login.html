<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Called To Build CRM</title>
    <link rel="icon" href="./public/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/auth.css" />
  </head>
  <body>
    <header class="site-header" aria-label="Challenge audience">
      <p class="eyebrow">
        <span class="eyebrow__dot" aria-hidden="true"></span>
        Christian Decluttering Business Owners
      </p>
    </header>

    <main class="auth-page">
      <section class="auth-card">
        <a class="auth-logo" href="./" aria-label="Called To Build home">
          <img src="./public/favicon.png" alt="" />
          <span>Called To Build</span>
        </a>
        <p class="auth-eyebrow">CRM Access</p>
        <h1>Welcome Back</h1>
        <p class="auth-lead">Log in to manage your leads, follow-ups, and conversion dashboard.</p>

        <form class="auth-form" data-auth-form="login">
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Log In</button>
          <p class="auth-message" data-auth-message role="status" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
          Need an account?
          <a href="/signup">Sign up</a>
        </p>
      </section>
    </main>
    <script type="module" src="./src/auth-pages.js"></script>
  </body>
</html>
